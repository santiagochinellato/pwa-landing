<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1619 656" width="1619" height="656">
	<defs>
		<image  width="1413" height="351" id="img1" href="data:image/png;base64,"/>
		<filter id="lightGray">
			<!-- En modo claro, forzamos un gris medio preservando el alpha -->
			<feColorMatrix type="matrix" values="
				0 0 0 0 0.32
				0 0 0 0 0.32
				0 0 0 0 0.32
				0 0 0 1 0
			"/>
		</filter>
	</defs>
	<style>
		@media (prefers-color-scheme: light) {
			#Background {
				filter: url(#lightGray);
			}
		}
	</style>
	<use id="Background" href="#img1" x="109" y="154"/>
</svg>